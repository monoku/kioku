# A release is merging its pull request (§6.4): a branch release/v<version> or hotfix/v<version>, as git flow has it. A
# push to main that moves the version in package.json and whose tag does not exist yet: the version is checked, the
# commit main is at is tested, and the GitHub release creates the tag on it and carries the bundle, built here from that
# commit, as kioku.mjs, which the installer and `kioku update` fetch
# (§6.3), its checksum as kioku.mjs.sha256, the plugin that travels beside it as kioku-plugin.tar.gz with its
# checksum (§6.2), and the CHANGELOG's section as its notes. Every release is the latest (§6.4).
name: release
on:
  push:
    # Only main, which a pull request reaches: the token that writes runs only code that was reviewed and checked. A tag
    # pushed by hand publishes nothing; a publication that failed is run again from the Actions page.
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the commits of the push, and the tags
      - name: What this push brings
        id: found
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node .github/scripts/publish-release.mjs find "$BEFORE" "$AFTER" "$RUNNER_TEMP/notes.md"
      - name: Take the commit to release
        if: steps.found.outputs.tag != ''
        env:
          SHA: ${{ steps.found.outputs.sha }}
        run: git checkout --detach "$SHA"
      - name: The tag is the version
        if: steps.found.outputs.tag != ''
        env:
          TAG: ${{ steps.found.outputs.tag }}
        run: node scripts/check-tag.mjs "$TAG"
      # Pinned to a commit, as a third-party action; it reads the version from package.json's packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.found.outputs.tag != ''
      - uses: actions/setup-node@v7
        if: steps.found.outputs.tag != ''
        with:
          node-version: 24
          cache: pnpm
      - if: steps.found.outputs.tag != ''
        run: pnpm install --frozen-lockfile
      - if: steps.found.outputs.tag != ''
        run: pnpm typecheck
      - if: steps.found.outputs.tag != ''
        run: pnpm lint
      - name: Build the bundle from the commit to release, and test it
        if: steps.found.outputs.tag != ''
        run: pnpm test
      - if: steps.found.outputs.tag != ''
        run: pnpm typecheck:plugin
      - name: Install Claude Code at the pinned version
        if: steps.found.outputs.tag != ''
        run: npm install --global "@anthropic-ai/claude-code@$(node -p 'require("./package.json").kioku.claudeCode')"
      - if: steps.found.outputs.tag != ''
        run: pnpm test:plugin
      - name: Publish the release
        if: steps.found.outputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.found.outputs.tag }}
          SHA: ${{ steps.found.outputs.sha }}
        run: |
          sha256sum lib/kioku.mjs | awk '{ print $1 "  kioku.mjs" }' > kioku.mjs.sha256
          sha256sum lib/kioku-plugin.tar.gz | awk '{ print $1 "  kioku-plugin.tar.gz" }' > kioku-plugin.tar.gz.sha256
          node .github/scripts/publish-release.mjs publish "$TAG" "$SHA" "$RUNNER_TEMP/notes.md" lib/kioku.mjs kioku.mjs.sha256 lib/kioku-plugin.tar.gz kioku-plugin.tar.gz.sha256
