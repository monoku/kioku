# Weekly, one pull request per update: the actions the workflows use and the packages the lockfile holds. Each goes
# to develop, where every change lands before a release takes it to main.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    ignore:
      # The types of the oldest Node Kioku runs on (engines.node), so that nothing newer type-checks by mistake.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
